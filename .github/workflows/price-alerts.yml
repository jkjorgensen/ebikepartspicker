name: price-alerts
on:
  schedule: [{ cron: '0 15 * * *' }]  # daily 8-9 AM Mountain
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert sender (skips if ALERT_RUN_TOKEN repo secret not set)
        env: { T: '${{ secrets.ALERT_RUN_TOKEN }}' }
        run: |
          [ -z "$T" ] && { echo "ALERT_RUN_TOKEN not set; skipping"; exit 0; }
          curl -fsS -X POST -H "Authorization: Bearer $T" https://ebikepartspicker.pages.dev/api/alerts-run
